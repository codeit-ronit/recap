[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recap"
version = "0.6.0"
description = "RECAP — Experience-Learning Autonomous Reliability Agent (Prototype). Simulated by default; real Kubernetes targets since M5."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "codeit-ronit" }]
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "mcp>=2.3,<3",        # official Model Context Protocol SDK (real stdio server + client)
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "cryptography>=42",   # Ed25519 signatures for single-use execution capabilities
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=2.4", "types-PyYAML"]
llm = ["anthropic>=1.13,<2"]               # optional real-LLM provider (your own API key + billing)
embeddings = ["sentence-transformers>=3"]  # optional hybrid retrieval
otel = ["opentelemetry-sdk>=1.25"]         # optional OpenTelemetry console spans

[tool.setuptools.packages.find]
include = ["recap*", "apps*", "integrations*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "e2e: runs a real incident through the controller, the MCP tool server subprocess, the gateway and the simulator (sometimes through the HTTP API)",
    "live_cluster: needs the real local Kind cluster (M5); skipped unless RECAP_LIVE_KIND=1, never run in CI",
]

[tool.mypy]
# Type checking is scoped (M4, M5): the core interfaces (recap/core, the provider protocol, the
# recordings), the modules M4 added (the typed API, the evaluation records and their
# categorizer, the demo and type-generation scripts) and M5's Kubernetes adapter and API load
# test. Code outside this list is not retyped.
# CI runs `mypy` with exactly this list.
python_version = "3.11"
plugins = ["pydantic.mypy"]
files = [
    "recap/core",
    "recap/providers/protocol.py",
    "recap/providers/recordings.py",
    "recap/providers/local_memory.py",
    "recap/providers/transport.py",
    "recap/providers/factory.py",
    "recap/providers/catalog.py",
    "recap/environments/kubernetes",
    "apps/api",
    "scripts/api_load_test.py",
    "evals/records.py",
    "evals/categorize.py",
    "evals/runner.py",
    "scripts/eval_replay.py",
    "scripts/gen_dashboard_types.py",
    "scripts/recordings_manifest.py",
    "scripts/secret_scan.py",
    "scripts/seed_demo.py",
]
follow_imports = "silent"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["apps/dashboard"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF100"]
