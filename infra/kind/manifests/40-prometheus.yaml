# One small Prometheus for RECAP's metric reads (docs/m5-integration-plan.md, section 3.8).
# Not applied yet.
#
# It scrapes only the frontend and backend pods in recap-demo (every 15 s, ready or not, so a
# pod that refuses traffic under memory pressure is still measured) and adds three labels from
# Kubernetes service discovery to every series: namespace, pod and app=<service>. Its own
# ServiceAccount, separate from RECAP's four, may only get, list and watch pods in recap-demo.
# No Grafana, no Alertmanager, no operator, no persistent volume: six hours of data on an
# emptyDir that disappears with the pod. The query API is read-only (the admin and lifecycle
# APIs stay off, as by default) and reaches the Mac only on 127.0.0.1:30090.
#
# Image: prom/prometheus v3.15.1, pinned by its multi-arch index digest (read from Docker Hub's
# public tag metadata on 2026-11-02; about 105 MB compressed for arm64). The node pulls it
# once, by digest; it is the only image the node pulls.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: recap-system
  labels: {app: prometheus, app.kubernetes.io/part-of: recap-m5}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-discovery
  namespace: recap-demo
  labels: {app: prometheus, app.kubernetes.io/part-of: recap-m5}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-discovery
  namespace: recap-demo
  labels: {app: prometheus, app.kubernetes.io/part-of: recap-m5}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-discovery
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: recap-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: recap-system
  labels: {app: prometheus, app.kubernetes.io/part-of: recap-m5}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 5s
    scrape_configs:
      - job_name: recap-demo
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [recap-demo]
        relabel_configs:
          # Only the two demo services, on their port named "http", while the pod exists.
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: frontend|backend
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: http
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Pending|Succeeded|Failed
            action: drop
          # The labels RECAP's queries select on.
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: recap-system
  labels: {app: prometheus, app.kubernetes.io/part-of: recap-m5}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels: {app: prometheus}
  strategy:
    type: Recreate  # one database on an emptyDir: never two copies at once
  template:
    metadata:
      labels: {app: prometheus, app.kubernetes.io/part-of: recap-m5}
    spec:
      serviceAccountName: prometheus
      automountServiceAccountToken: true  # service discovery reads the API with it
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=6h
            - --storage.tsdb.retention.size=512MB
            - --web.listen-address=:9090
          ports:
            - {name: http, containerPort: 9090, protocol: TCP}
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /-/healthy, port: http}
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
        - name: data
          emptyDir: {sizeLimit: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: recap-system
  labels: {app: prometheus, app.kubernetes.io/part-of: recap-m5}
spec:
  type: NodePort
  selector: {app: prometheus}
  ports:
    - {name: http, port: 9090, targetPort: http, nodePort: 30090, protocol: TCP}
