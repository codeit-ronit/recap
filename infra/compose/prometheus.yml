# Prometheus for RECAP's Compose setup (the `metrics` profile; M6 W3).
# The API answers GET /metrics only with RECAP_METRICS=1 (apps/api/metrics.py); with the Redis
# backend it also reports the queue: depth, capacity, queue wait, workers alive and busy, and the
# jobs' outcomes. Each worker serves its own runs' metrics on port 9100 (apps/worker/metrics.py):
# every replica of the worker service is found through Compose's DNS (M6 W6).
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: recap-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: recap-workers
    metrics_path: /metrics
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9100
