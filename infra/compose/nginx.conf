# Mission Control behind an unprivileged nginx (M6 W3, infra/compose/Dockerfile).
#
# Static files at /, the API at /api/ (the prefix stripped, as the Vite dev server does), so the
# browser talks to one origin. The browser's Host header is passed on unchanged: the API still
# refuses any host name it does not serve, and any state-changing request from a page on
# another origin (apps/api/auth.py). Every temporary path is under /tmp, so the container's
# root filesystem can be read-only.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        root /usr/share/nginx/html;

        location /api/ {
            proxy_pass http://api:8000/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            # Server-sent events: no buffering, and a stream may stay open for an hour.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        location / {
            try_files $uri /index.html;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
        }
    }
}
