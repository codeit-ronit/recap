# Demo 5 (budget): a real incident, but the run may make only 3 tool calls.
id: budget-exhausted
title: "Inventory readiness failures on a tiny budget"
description: "Memory pressure on inventory, investigated with a budget of 3 tool calls. The run must stop with BUDGET_EXHAUSTED: no untracked calls and no false recovery."
family: resource_pressure
partition: demo
seed: 51
tags: [demo, budget]
incident_time: "2026-03-18T08:20:00Z"
namespace: shop
alert:
  service: inventory
  affected_services: [inventory]
  symptoms:
    - "inventory: readiness probe failures on 1 of 2 pods"
