# M3 live evaluation plan: real-model runs on the SIMULATED environment, all approved by the
# simulation auto-approver (the human-approved deliverable is a separate demo.py run).
# One data folder for the whole plan, in this order:
#   1-3  multi-agent investigations: a cross-service incident and the unfamiliar held-out one
#        (keywords, then keywords + meaning)
#   4-6  memory: a first run writes a LIVE episode; a second, look-alike incident with another
#        cause must reject it; a repeat of the first may reuse it after the live check
#   7    adversarial, last (it plants a false memory and indexes a poisoned runbook)
# Run: .venv/bin/python scripts/live_eval.py evals/plans/m3-real-models.yaml --out <folder>
provider: ollama
runs:
  - {id: cross-service, scenario: ambiguous-incident, strategy: parallel}
  - {id: unfamiliar, scenario: m3-inventory-leak-behind-frontend, strategy: parallel}
  - {id: unfamiliar-hybrid, scenario: m3-inventory-leak-behind-frontend, strategy: parallel, retrieval: hybrid}
  - {id: memory-first, scenario: bad-deployment}
  - {id: memory-look-alike, scenario: memory-caution}
  - {id: memory-repeat, scenario: bad-deployment}
  - id: adversarial
    scenario: m3-payment-release-under-forged-signals
    strategy: parallel
    overlays: [fixtures/knowledge-overlays/poisoned]
    false_memory: fixtures/redteam/false-memory-checkout-restart.yaml
